nodeLinker: node-modules

# Vendor cache targets: Yarn normally only fetches platform-specific
# binaries matching the host arch (darwin-arm64 on dev machines, linux-x64
# on CI/EC2). The enclave Docker build always runs as linux-amd64, so
# without this config vendor-deps.sh on a Mac silently skips the linux-x64
# esbuild / rolldown / lightningcss / react-native-* binaries and the
# offline Dockerfile stage fails with YN0056 "Cache entry required but
# missing". Declaring both covers dev + build in one cache.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
